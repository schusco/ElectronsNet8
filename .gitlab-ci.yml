stages:
  - deploy
  - release

deploy_godaddy:
  stage: deploy
  tags:
    - saas-windows-medium-amd64
  script:
    # Use the existing publish profile. 
    # Note: We pass the password via variable to keep it out of the repo.
    - dotnet publish Electrons.Net8/Electrons.Net8.csproj -c Release /p:PublishProfile="dev.electronsbaseball.com - Web Deploy.pubxml" /p:Password="$env:GD_PASSWORD" /p:AllowUntrustedCertificate=True
  only:
    - master

create_release:
  stage: release
  tags:
    - saas-windows-medium-amd64
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Stable build of ElectronsNet8 - $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
  only:
    - tags  # This job ONLY runs when you create a git tag