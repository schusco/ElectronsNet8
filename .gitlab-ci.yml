stages:
  - deploy
  - release

deploy_godaddy_dev:
  stage: deploy
  tags:
    - saas-windows-medium-amd64
  script:
    # Use the existing publish profile. 
    # Note: We pass the password via variable to keep it out of the repo.
    - dotnet publish Electrons.Net8/Electrons.Net8.csproj -c Release /p:PublishProfile="test.electronsbaseball.com - Web Deploy.pubxml" /p:Password="$env:GD_PASSWORD" /p:AllowUntrustedCertificate=True
  only:
    - master

deploy_production:
  stage: deploy
  tags:
    - saas-windows-medium-amd64
  script:
    - dotnet publish Electrons.Net8/Electrons.Net8.csproj -c Release /p:PublishProfile="deploy.electronsbaseball.com - Web Deploy.pubxml" /p:Password="$env:GD_PASSWORD" /p:AllowUntrustedCertificate=True 
  when: manual
  only:
    - tags

create_release:
  stage: release
  tags:
    - saas-windows-medium-amd64
  script:
    - |
      $tag = "$CI_COMMIT_TAG"
      $projId = $CI_PROJECT_ID
      $apiUrl = "$CI_API_V4_URL/projects/$projId/releases"
      
      $body = @{
        name = "Release $tag"
        tag_name = "$tag"
        description = "Stable build of ElectronsNet8 - $tag"
      } | ConvertTo-Json
      
      Write-Host "Creating release at: $apiUrl"
      
      Invoke-RestMethod -Method Post -Uri $apiUrl `
        -Headers @{"JOB-TOKEN"="$CI_JOB_TOKEN"} `
        -ContentType "application/json" `
        -Body $body
  only:
    - tags